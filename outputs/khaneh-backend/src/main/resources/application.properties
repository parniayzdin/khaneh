server.address=127.0.0.1
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/khaneh}
spring.datasource.username=${DB_USER:khaneh}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=6
spring.flyway.enabled=true
server.error.include-message=always
server.error.include-stacktrace=never
khaneh.storage=${KHANEH_STORAGE:./var/artifacts}
khaneh.token-file=${KHANEH_TOKEN_FILE:./var/worker.token}
spring.jackson.serialization.write-dates-as-timestamps=false
